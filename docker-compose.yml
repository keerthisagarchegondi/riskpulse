name: riskpulse

x-app-env: &app-env
  RISKPULSE_ENV: dev
  RISKPULSE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  RISKPULSE_DB_HOST: postgres
  RISKPULSE_DB_PORT: "5432"
  RISKPULSE_DB_NAME: riskpulse
  RISKPULSE_DB_USER: riskpulse
  RISKPULSE_DB_PASSWORD: riskpulse_dev_password
  RISKPULSE_REDIS_HOST: redis
  RISKPULSE_REDIS_PORT: "6379"
  RISKPULSE_STORAGE_BACKEND: ${RISKPULSE_STORAGE_BACKEND:-local}
  RISKPULSE_LOCAL_STORAGE_ROOT: ${RISKPULSE_LOCAL_STORAGE_ROOT:-.local_storage}
  RISKPULSE_METRICS_BACKEND: ${RISKPULSE_METRICS_BACKEND:-local}
  RISKPULSE_LOCAL_METRICS_PATH: ${RISKPULSE_LOCAL_METRICS_PATH:-.local_storage/metrics/metrics.jsonl}
  AWS_REGION: ${AWS_REGION:-us-east-1}

x-health-defaults: &health-defaults
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      <<: *health-defaults
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riskpulse
      POSTGRES_USER: riskpulse
      POSTGRES_PASSWORD: riskpulse_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskpulse -d riskpulse"]
      <<: *health-defaults
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health-defaults
    volumes:
      - redis-data:/data
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: riskpulse/api:dev
    environment:
      <<: *app-env
      UVICORN_WORKERS: "1"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py", "api"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./schemas:/app/schemas:ro
      - riskpulse-local-storage:/app/.local_storage
    networks:
      - public
      - backend

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    image: riskpulse/worker:dev
    environment:
      <<: *app-env
      RISKPULSE_SERVICE: worker
      RISKPULSE_KAFKA_HOST: kafka
      RISKPULSE_KAFKA_PORT: "29092"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py", "worker"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./schemas:/app/schemas:ro
      - riskpulse-local-storage:/app/.local_storage
    networks:
      - backend

  streamlit:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.streamlit
    image: riskpulse/streamlit:dev
    environment:
      <<: *app-env
      RISKPULSE_SERVICE: streamlit
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py", "streamlit"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ./dashboards/streamlit:/app/dashboards/streamlit:ro
      - ./src/utils:/app/src/utils:ro
      - ./config:/app/config:ro
      - riskpulse-local-storage:/app/.local_storage
    networks:
      - public
      - backend

  airflow:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    image: riskpulse/airflow:dev
    environment:
      <<: *app-env
      RISKPULSE_SERVICE: airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://riskpulse:riskpulse_dev_password@postgres:5432/riskpulse
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: riskpulse-dev-airflow-secret
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "/opt/airflow/scripts/container_healthcheck.py", "airflow"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./src:/opt/airflow/src:ro
      - ./config:/opt/airflow/config:ro
      - airflow-logs:/opt/airflow/logs
      - riskpulse-local-storage:/opt/airflow/.local_storage
    networks:
      - public
      - backend

volumes:
  zookeeper-data:
  kafka-data:
  postgres-data:
  redis-data:
  airflow-logs:
  riskpulse-local-storage:

networks:
  public:
    name: riskpulse-public
  backend:
    name: riskpulse-backend
    internal: false
