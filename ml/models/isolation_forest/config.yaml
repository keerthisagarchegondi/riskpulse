# Isolation Forest Model Configuration
# Used by AnomalyDetector and training pipeline

model:
  algorithm: "isolation_forest"
  version: "1.0.0"

hyperparameters:
  n_estimators: 200
  max_samples: "auto"
  contamination: 0.02
  max_features: 0.8
  random_state: 42
  n_jobs: -1
  warm_start: false

features:
  - transaction_amount
  - transaction_count_1hour
  - transaction_count_24hour
  - amount_mean_24hour
  - amount_std_24hour
  - time_since_last_transaction_seconds
  - distance_from_last_location_km
  - unique_merchants_24hour
  - unique_countries_24hour
  - hour_of_day
  - is_international
  - amount_to_avg_ratio

training:
  data:
    n_samples: 10000
    fraud_ratio: 0.02
    time_based_split: true
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

  cross_validation:
    strategy: "time_series"
    n_splits: 5

  hyperparameter_search:
    enabled: false
    grid:
      n_estimators: [100, 200, 300]
      max_samples: [256, 512, "auto"]
      contamination: [0.01, 0.02, 0.03, 0.05]
      max_features: [0.5, 0.8, 1.0]

evaluation:
  thresholds:
    min_precision: 0.80
    min_recall: 0.85
    max_false_positive_rate: 0.03
    max_latency_ms: 10.0

prediction:
  batch_size: 1000
  timeout_ms: 50
  cache_enabled: true
  cache_ttl_seconds: 300

serialization:
  format: "joblib"
  compression: 0
  checksum_algorithm: "sha256"

monitoring:
  drift_detection:
    enabled: true
    window_size: 1000
    threshold_psi: 0.2
  retraining_trigger:
    precision_drop: 0.05
    recall_drop: 0.05
    schedule: "weekly"
