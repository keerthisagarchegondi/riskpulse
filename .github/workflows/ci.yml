name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_MINIMUM: "65"
  RISKPULSE_DB_PASSWORD: ci-build-placeholder-not-secret
  POSTGRES_PORT: "15432"
  REDIS_PORT: "16379"
  KAFKA_PORT: "19092"
  ZOOKEEPER_PORT: "12181"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://riskpulse:ci-build-placeholder-not-secret@postgres:5432/riskpulse
  AIRFLOW__WEBSERVER__SECRET_KEY: ci-airflow-webserver-secret-for-compose-build
  RISKPULSE_STORAGE_BACKEND: local
  RISKPULSE_WAREHOUSE_BACKEND: local
  RISKPULSE_METRICS_BACKEND: local
  RISKPULSE_NOTIFICATION_BACKEND: local
  RISKPULSE_MONITORING__CLOUDWATCH__ENABLED: "false"
  RISKPULSE_SECURITY__SECRETS_MANAGER__ENABLED: "false"
  POWERBI_DATA_BACKEND: local
  RUN_AWS_CHECKS: "false"

jobs:
  secret-history:
    name: Full-History Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan every ref with Gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo gitleaks_checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --log-opts='--all --full-history' --redact .

  lint-test-scan:
    name: Lint, Test, Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librdkafka-dev libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint with black
        run: black --check src tests scripts dashboards ml airflow

      - name: Lint with isort
        run: isort --check-only src tests scripts dashboards ml airflow

      - name: Lint with flake8
        run: flake8 src tests scripts dashboards ml airflow

      - name: Type check with mypy
        run: mypy src

      - name: Start Docker integration dependencies
        run: |
          docker compose -f docker-compose.yml up -d --wait zookeeper kafka postgres redis
          docker compose -f docker-compose.yml ps

      - name: Unit tests with coverage gate
        env:
          RISKPULSE_ENV: test
          RISKPULSE_DB_HOST: localhost
          RISKPULSE_DB_PORT: "15432"
          RISKPULSE_DB_NAME: riskpulse
          RISKPULSE_DB_USER: riskpulse
          RISKPULSE_DB_PASSWORD: riskpulse_dev_password
          RISKPULSE_TEST_DATABASE_URL: postgresql+asyncpg://riskpulse:riskpulse_dev_password@localhost:15432/riskpulse
          RISKPULSE_REDIS_HOST: localhost
          RISKPULSE_REDIS_PORT: "16379"
        run: |
          pytest tests/unit \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${COVERAGE_MINIMUM}

      - name: Security regression tests
        env:
          RISKPULSE_ENV: test
        run: pytest tests/security -m security

      - name: Data quality validation tests
        env:
          RISKPULSE_ENV: test
        run: pytest tests/data_quality -m data_quality

      - name: ML model validation tests
        env:
          RISKPULSE_ENV: test
        run: pytest tests/ml_validation -m ml_validation

      - name: Integration tests
        env:
          RISKPULSE_ENV: test
          RISKPULSE_KAFKA_BOOTSTRAP_SERVERS: localhost:19092
          RISKPULSE_DB_HOST: localhost
          RISKPULSE_DB_PORT: "15432"
          RISKPULSE_DB_NAME: riskpulse
          RISKPULSE_DB_USER: riskpulse
          RISKPULSE_DB_PASSWORD: riskpulse_dev_password
          RISKPULSE_REDIS_HOST: localhost
          RISKPULSE_REDIS_PORT: "16379"
        run: pytest tests/integration --show-capture=no

      - name: Performance smoke benchmarks
        env:
          RISKPULSE_ENV: test
        run: pytest tests/performance/test_latency.py -m performance

      - name: Security scan with bandit
        run: bandit -r src scripts dashboards ml airflow -c pyproject.toml -ll -f json -o bandit-report.json

      - name: Dependency vulnerability scan with safety
        run: |
          python -m venv "$RUNNER_TEMP/riskpulse-runtime-scan"
          "$RUNNER_TEMP/riskpulse-runtime-scan/bin/python" -m pip install --quiet -e .
          "$RUNNER_TEMP/riskpulse-runtime-scan/bin/python" -m pip freeze --exclude-editable > "$RUNNER_TEMP/riskpulse-runtime-requirements.txt"
          safety check --file "$RUNNER_TEMP/riskpulse-runtime-requirements.txt" --full-report

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate public ingress overlay
        env:
          RISKPULSE_API_DOMAIN: api.example.invalid
          RISKPULSE_DASHBOARD_DOMAIN: dashboard.example.invalid
          RISKPULSE_API_KEY: ci-only-api-key
          RISKPULSE_JWT_SECRET: ci-only-jwt-secret-32-byte-placeholder
          RISKPULSE_MODEL_SIGNING_KEY: ci-only-model-signing-key-32-byte-placeholder
          DASHBOARD_ADMIN_USER: ci-admin
          DASHBOARD_ADMIN_PASSWORD: ci-only-dashboard-password
          RISKPULSE_INGRESS_TLS_DIR: ${{ runner.temp }}/riskpulse-tls
          RISKPULSE_INGRESS_AUTH_FILE: ${{ runner.temp }}/riskpulse-htpasswd
        run: |
          mkdir -p "$RISKPULSE_INGRESS_TLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=api.example.invalid' \
            -keyout "$RISKPULSE_INGRESS_TLS_DIR/privkey.pem" \
            -out "$RISKPULSE_INGRESS_TLS_DIR/fullchain.pem" >/dev/null 2>&1
          chmod 644 "$RISKPULSE_INGRESS_TLS_DIR/privkey.pem"
          printf 'ci:%s\n' "$(openssl passwd -apr1 ci-only-placeholder)" > "$RISKPULSE_INGRESS_AUTH_FILE"
          docker compose -f docker-compose.prod.yml -f docker-compose.public.yml config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.public.yml config --format json \
            | python -c 'import json,sys; services=json.load(sys.stdin)["services"]; assert not services["api"].get("ports"); assert not services["streamlit"].get("ports")'
          docker compose -f docker-compose.prod.yml -f docker-compose.public.yml run --rm --no-deps ingress nginx -t

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build api worker streamlit airflow

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: ignore

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Stop Docker integration dependencies
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
