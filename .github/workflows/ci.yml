name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  COVERAGE_MINIMUM: "90"

jobs:
  lint-test-scan:
    name: Lint, Test, Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: riskpulse
          POSTGRES_USER: riskpulse
          POSTGRES_PASSWORD: riskpulse_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskpulse -d riskpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librdkafka-dev libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint with black
        run: black --check src tests scripts

      - name: Lint with isort
        run: isort --check-only src tests scripts

      - name: Lint with flake8
        run: flake8 src tests scripts

      - name: Type check with mypy
        run: mypy src

      - name: Unit tests with coverage gate
        env:
          RISKPULSE_ENV: test
          RISKPULSE_DB_HOST: localhost
          RISKPULSE_DB_PORT: "5432"
          RISKPULSE_DB_NAME: riskpulse
          RISKPULSE_DB_USER: riskpulse
          RISKPULSE_DB_PASSWORD: riskpulse_dev_password
          RISKPULSE_REDIS_HOST: localhost
          RISKPULSE_REDIS_PORT: "6379"
        run: |
          pytest tests/unit \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${COVERAGE_MINIMUM}

      - name: Security regression tests
        env:
          RISKPULSE_ENV: test
        run: pytest tests/security -m security

      - name: Start Docker integration dependencies
        run: |
          docker compose -f docker-compose.yml up -d zookeeper kafka postgres redis
          docker compose -f docker-compose.yml ps

      - name: Integration tests
        env:
          RISKPULSE_ENV: test
          RISKPULSE_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          RISKPULSE_DB_HOST: localhost
          RISKPULSE_DB_PORT: "5432"
          RISKPULSE_DB_NAME: riskpulse
          RISKPULSE_DB_USER: riskpulse
          RISKPULSE_DB_PASSWORD: riskpulse_dev_password
          RISKPULSE_REDIS_HOST: localhost
          RISKPULSE_REDIS_PORT: "6379"
        run: pytest tests/integration -m integration

      - name: Performance smoke benchmarks
        env:
          RISKPULSE_ENV: test
        run: pytest tests/performance/test_latency.py -m performance

      - name: Security scan with bandit
        run: bandit -r src -c pyproject.toml -f json -o bandit-report.json

      - name: Dependency vulnerability scan with safety
        run: safety check --full-report

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build api worker streamlit airflow

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: ignore

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Stop Docker integration dependencies
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
