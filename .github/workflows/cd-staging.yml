name: CD Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: staging-${{ github.sha }}
  DEPLOYMENT_BACKEND: local
  DEPLOY_ENVIRONMENT: staging
  RISKPULSE_DB_PASSWORD: ci-build-placeholder-not-secret
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://riskpulse:ci-build-placeholder-not-secret@postgres:5432/riskpulse
  AIRFLOW__WEBSERVER__SECRET_KEY: ci-airflow-webserver-secret-for-compose-build

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Local Images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image-tag: ${{ env.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build api worker streamlit airflow

  deploy:
    name: Validate Local Staging Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate local deployment plan
        env:
          DRY_RUN: "true"
        run: |
          bash scripts/deploy.sh staging "${IMAGE_TAG}"
          docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Notify success
        if: success() && vars.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"RiskPulse staging deploy succeeded: ${IMAGE_TAG}\"}" \
            "${{ vars.SLACK_WEBHOOK_URL }}"

      - name: Notify failure
        if: failure() && vars.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"RiskPulse staging deploy failed: ${IMAGE_TAG}\"}" \
            "${{ vars.SLACK_WEBHOOK_URL }}"
