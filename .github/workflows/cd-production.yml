name: CD Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string
      confirm_production:
        description: Type deploy-production to confirm
        required: true
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || format('production-{0}', github.sha) }}
  DEPLOYMENT_BACKEND: local
  DEPLOY_ENVIRONMENT: production
  RISKPULSE_DB_PASSWORD: ci-build-placeholder-not-secret
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://riskpulse:ci-build-placeholder-not-secret@postgres:5432/riskpulse
  AIRFLOW__WEBSERVER__SECRET_KEY: ci-airflow-webserver-secret-for-compose-build

jobs:
  ci:
    if: github.event_name == 'push' || github.event.inputs.confirm_production == 'deploy-production'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Production Images
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build api worker streamlit airflow

  deploy:
    name: Validate Production Deployment Plan
    needs:
      - ci
      - build
    if: always() && needs.ci.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate local production deployment plan
        env:
          DRY_RUN: "true"
        run: |
          bash scripts/deploy.sh production "${IMAGE_TAG}"
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet

      - name: Notify plan validation success
        if: success() && vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data '{"text":"RiskPulse production plan validated; no deployment was performed."}' \
            "$SLACK_WEBHOOK_URL"

      - name: Notify plan validation failure
        if: failure() && vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data '{"text":"RiskPulse production plan validation failed; no deployment was attempted."}' \
            "$SLACK_WEBHOOK_URL"
